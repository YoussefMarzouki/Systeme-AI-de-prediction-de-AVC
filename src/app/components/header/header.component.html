<header class="header">
  <!-- Search bar -->
  <div class="search-container">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="7" cy="7" r="5" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M11 11l3 3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input type="text" placeholder="Search patients or records..." class="search-input" />
  </div>

  <!-- Right section -->
  <div class="header-right">
    <!-- Notification bell -->
    <button class="icon-btn" id="notificationBtn" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 2a5 5 0 00-5 5v3l-1.5 2.5h13L15 10V7a5 5 0 00-5-5z" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 16a2 2 0 004 0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="notification-dot"></span>
    </button>

    <!-- Help -->
    <button class="icon-btn" id="helpBtn" aria-label="Help">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" stroke="#2563eb" stroke-width="1.5" fill="#2563eb" fill-opacity="0.1"/>
        <text x="10" y="14" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">?</text>
      </svg>
    </button>

    <!-- User profile -->
    <div class="user-profile">
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
      <div class="user-avatar">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="18" fill="#e2e8f0"/>
          <circle cx="18" cy="14" r="5" fill="#94a3b8"/>
          <path d="M8 30c0-5.523 4.477-10 10-10s10 4.477 10 10" fill="#94a3b8"/>
        </svg>
      </div>
    </div>
  </div>
</header>
