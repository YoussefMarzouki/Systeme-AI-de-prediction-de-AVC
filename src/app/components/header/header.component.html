<header class="header">
  
  <div class="header-left">
    <div class="header-title">Clinical Information System</div>
    
    <div class="header-tabs">
      <a [routerLink]="prefix + '/dashboard'" routerLinkActive="active" class="header-tab">Dashboard</a>
      <a [routerLink]="prefix + '/registration'" routerLinkActive="active" class="header-tab">Patient Records</a>
      <a *ngIf="state.isCurrentUserMedecin" [routerLink]="prefix + '/intake'" routerLinkActive="active" class="header-tab">CDS Analysis</a>
      <a *ngIf="state.isCurrentUserMedecin" [routerLink]="prefix + '/rapport'" routerLinkActive="active" class="header-tab">Reports</a>
    </div>
  </div>

  <div class="header-right">
    <!-- Search bar -->
    <div class="search-container">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search patients..." class="search-input" id="globalSearch" />
    </div>

    <!-- Notification bell -->
    <button class="icon-btn" id="notificationBtn" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-dot"></span>
    </button>

    <!-- Settings -->
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    
    <!-- Help -->
    <button class="icon-btn" id="helpBtn" aria-label="Help">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>

    <!-- User profile -->
    <div class="user-profile" id="userProfile" (click)="toggleRole()" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; flex-direction: column; text-align: right;">
        <span style="font-size: 0.85rem; font-weight: 600; color: #1e293b;">{{ userName }}</span>
        <span style="font-size: 0.75rem; color: #64748b;">{{ userRole }}</span>
      </div>
      <div class="user-avatar-wrap">
        <div class="user-avatar">
          <span>{{ userInitials }}</span>
        </div>
      </div>
    </div>
  </div>
</header>
