<div class="page-container">
  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <span class="breadcrumb-dot"></span>
    <span class="breadcrumb-text">PATIENTS › NEW REGISTRATION</span>
  </div>

  <!-- Page Title -->
  <div class="page-header">
    <h1 class="page-title">New Patient Registration</h1>
    <p class="page-subtitle">Complete the intake process for a new clinical record.</p>
  </div>

  <div class="content-grid">
    <!-- Main Form Area -->
    <div class="form-area">

      <!-- Demographics Section -->
      <div class="form-card">
        <div class="card-header">
          <div class="card-icon blue">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 18c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 class="card-title">Demographics</h2>
        </div>

        <form [formGroup]="registrationForm">
          <div class="form-row two-col">
            <div class="form-group">
              <label class="form-label">FULL LEGAL NAME</label>
              <input type="text" formControlName="fullLegalName" placeholder="e.g. Johnathan Doe" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label">NATIONAL ID</label>
              <input type="text" formControlName="cin" placeholder="AB123456" class="form-input" />
            </div>
          </div>

          <div class="form-row two-col">
            <div class="form-group">
              <label class="form-label">DATE OF BIRTH</label>
              <div class="input-with-icon">
                <input type="date" formControlName="dateOfBirth" placeholder="mm/dd/yyyy" class="form-input" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">GENDER IDENTITY</label>
              <select formControlName="genderIdentity" class="form-input form-select">
                <option value="" disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
          </div>
        </form>
      </div>

      <!-- Contact Details -->
      <div class="form-card">
        <div class="card-header">
          <div class="card-icon blue">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="4" y="2" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6 16c0-2.21 1.79-4 4-4s4 1.79 4 4" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          <h2 class="card-title">Contact Details</h2>
        </div>

        <form [formGroup]="registrationForm">
          <div class="form-group">
            <label class="form-label">PHONE NUMBER</label>
            <input type="tel" formControlName="phoneNumber" placeholder="+216 20 123 456" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">EMAIL ADDRESS</label>
            <input type="email" formControlName="emailAddress" placeholder="patient@example.tn" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">HOME ADDRESS</label>
            <input type="text" formControlName="homeAddress" placeholder="e.g. 2000 Bardo, Tunis" class="form-input" />
          </div>
        </form>
      </div>

      <!-- Emergency Contact -->
      <div class="form-card">
        <div class="card-header">
          <div class="card-icon red">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 2l2.47 4.56L18 7.64l-4 3.56 1.06 5.8L10 14.27 4.94 17l1.06-5.8-4-3.56 5.53-1.08z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="currentColor" fill-opacity="0.15"/>
            </svg>
          </div>
          <h2 class="card-title red-title">Emergency Contact</h2>
        </div>

        <form [formGroup]="registrationForm">
          <div class="form-row three-col">
            <div class="form-group">
              <label class="form-label">CONTACT NAME</label>
              <input type="text" formControlName="emergencyContactName" placeholder="Full Name" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label">RELATIONSHIP</label>
              <input type="text" formControlName="emergencyRelationship" placeholder="e.g. Spouse, Parent" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label">PHONE NUMBER</label>
              <input type="tel" formControlName="emergencyPhone" placeholder="+216 98 123 456" class="form-input" />
            </div>
          </div>
        </form>
      </div>

    </div>

  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn btn-ghost" type="button" (click)="onDiscard()">Discard</button>
    <div class="action-bar-right">

      <button class="btn btn-primary" type="button" (click)="onCompleteRegistration()">
        Complete Registration
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M13.5 4.5l-7 7L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>
