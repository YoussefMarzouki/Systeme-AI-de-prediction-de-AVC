<div class="login-shell">
  <section class="login-panel" aria-label="Clinical authentication">
    <aside class="mri-side" aria-label="MRI preview">
      <img src="/LoginImage.png" alt="StrokeAI MRI login visual" class="mri-image" />
      
      <div class="mri-frame">
        <div class="scan-cross horizontal"></div>
        <div class="scan-cross vertical"></div>
        <div class="scan-ruler"></div>
      </div>

      <div class="brand-signature">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M9 5.5v13M15 5.5v13M5.5 11.8h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M7.5 4h9A3.5 3.5 0 0 1 20 7.5v9a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5v-9A3.5 3.5 0 0 1 7.5 4Z" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <span>
          <strong>StrokeAI</strong>
          <small>Clinical Systems</small>
        </span>
      </div>
    </aside>

    <div class="form-side">
      <div class="form-card">
        <header class="login-heading">
          <h1>Clinical Gateway</h1>
          <p>Authenticate to access StrokeAI diagnostic tools.</p>
        </header>

        <div class="error-banner" *ngIf="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 8v5M12 17h.01M10.3 4.5 2.7 18a1.7 1.7 0 0 0 1.5 2.5h15.6a1.7 1.7 0 0 0 1.5-2.5L13.7 4.5a1.9 1.9 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="field-group">
            <label for="email">Clinical ID</label>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Enter practitioner ID"
              autocomplete="email"
            />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-control">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
                <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m4 4 16 16M9.4 9.4A3.6 3.6 0 0 0 12 15.6c1 0 1.9-.4 2.6-1.1M7.2 7.7C4.2 9.5 2.5 12 2.5 12s3.5 6 9.5 6c1.8 0 3.3-.5 4.6-1.2M10.8 6.1c.4-.1.8-.1 1.2-.1 6 0 9.5 6 9.5 6s-.8 1.4-2.3 2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="role-group">
            <span class="role-label">System Role</span>
            <div class="role-row">
              <button
                *ngFor="let role of roles"
                type="button"
                class="role-option"
                [class.active]="selectedRole === role.key"
                (click)="selectRole(role.key)"
              >
                {{ role.label }}
              </button>
            </div>
          </div>

          <div class="session-row">
            <label class="remember-option">
              <input type="checkbox" />
              <span>Remember terminal</span>
            </label>
            <a href="#" aria-label="Need assistance">Need assistance?</a>
          </div>

          <button type="submit" class="submit-button" [disabled]="isLoading">
            <span>{{ isLoading ? 'Authenticating...' : 'Authenticate Session' }}</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3 5 6v5c0 4.4 2.9 8.4 7 9.7 4.1-1.3 7-5.3 7-9.7V6l-7-3Z" stroke="currentColor" stroke-width="1.8"/>
              <path d="m9 12 2 2 4-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>


      </div>
    </div>
  </section>
</div>
